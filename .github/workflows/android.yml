name: Android Build & APK Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Build Environment & Keystore
        run: |
          chmod +x gradlew || true
          # إنشاء مفتاح debug.keystore تلقائياً في حال لم يكن مرفوعاً
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          # إنشاء ملف .env افتراضي في حال عدم وجوده
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Optimized Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload Fast Release APK (Recommended)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-app-release-optimized
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
