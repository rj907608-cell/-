name: Android Fast Build (Release Only)

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fast Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Build Environment & Keystore
        run: |
          chmod +x gradlew || true
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Single Lightweight Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --build-cache --parallel

      - name: Upload Single Optimized Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
